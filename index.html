<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ruffino — Italienisches Fine Dining · München</title>
  <meta name="description" content="Ruffino — ein italienisches Haus in einer ruhigen Straße in Sendling-Westpark. Saisonale italienische Küche, mit Zurückhaltung serviert. Di–Sa ab 17:30." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
/* ===========================================================
   Ruffino — Editorial luxury system
   =========================================================== */

:root {
  /* Palette — Ivory */
  --bg: #F4EFE5;
  --bg-2: #EAE2D2;
  --paper: #F8F4EC;
  --ink: #1A1812;
  --ink-soft: #3A352B;
  --olive: #3E4633;
  --olive-deep: #2A2F23;
  --terracotta: #B8624A;
  --terracotta-soft: rgba(184, 98, 74, 0.18);
  --rule: rgba(26, 24, 18, 0.18);

  /* Type */
  --serif: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --sans: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  --label-track: 0.22em;

  /* Motion */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --slow: 1100ms;
  --med: 700ms;
}

/* Dark / atmospheric blocks */
.atmosphere {
  --bg: #18160F;
  --bg-2: #221F17;
  --ink: #F4EFE5;
  --ink-soft: #C7BFAE;
  --rule: rgba(244, 239, 229, 0.18);
  --olive: #8C9277;
  background: var(--bg);
  color: var(--ink);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  scroll-behavior: smooth;
}

body {
  overflow-x: hidden;
  position: relative;
}

/* Subtle grain overlay (CSS-only, no images) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9000;
  opacity: 0.06;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(rgba(0,0,0,0.7) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
  background-size: 3px 3px, 5px 5px;
  background-position: 0 0, 1px 2px;
}

/* ---------- Typography ---------- */
.display {
  font-family: var(--serif);
  font-weight: 300;
  letter-spacing: -0.015em;
  line-height: 0.98;
  color: var(--ink);
}

.display em {
  font-style: italic;
  color: var(--olive-deep);
}
.atmosphere .display em { color: var(--terracotta); }

.eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
}

.eyebrow.with-rule {
  display: inline-flex;
  align-items: center;
  gap: 14px;
}
.eyebrow.with-rule::before {
  content: "";
  width: 28px;
  height: 1px;
  background: currentColor;
  opacity: 0.6;
}

.lede {
  font-family: var(--serif);
  font-weight: 300;
  font-style: italic;
  font-size: clamp(20px, 1.6vw, 26px);
  line-height: 1.45;
  color: var(--ink-soft);
  letter-spacing: 0.005em;
}

.body-copy {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--ink-soft);
  letter-spacing: 0.005em;
}

.body-copy p + p { margin-top: 1.1em; }

/* ---------- Layout primitives ---------- */
.section {
  position: relative;
  padding: clamp(80px, 14vh, 180px) clamp(24px, 6vw, 96px);
}

.container {
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

.container-narrow {
  max-width: 980px;
  margin: 0 auto;
}

.grid-12 {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(16px, 2vw, 32px);
}

/* ---------- Buttons / links ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 28px 15px;
  border: 1px solid currentColor;
  background: transparent;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  border-radius: 0;
  transition: background var(--med) var(--ease), color var(--med) var(--ease), padding var(--med) var(--ease);
}

.btn .arrow {
  display: inline-block;
  width: 16px;
  height: 1px;
  background: currentColor;
  position: relative;
  transition: width var(--med) var(--ease);
}
.btn .arrow::after {
  content: "";
  position: absolute;
  right: 0;
  top: -3px;
  width: 7px;
  height: 7px;
  border-right: 1px solid currentColor;
  border-top: 1px solid currentColor;
  transform: rotate(45deg);
}
.btn:hover .arrow { width: 28px; }

.btn-solid {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn-solid:hover { background: var(--olive-deep); border-color: var(--olive-deep); }

.btn-ghost { color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }

/* Quiet link */
.qlink {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  position: relative;
  padding-bottom: 3px;
}
.qlink::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--med) var(--ease);
}
.qlink:hover::after { transform: scaleX(1); }

/* ---------- Image slot defaults ---------- */
image-slot {
  --is-bg-color: var(--bg-2);
  --is-border-color: transparent;
  --is-placeholder-color: var(--ink-soft);
  display: block;
  width: 100%;
  height: 100%;
  background:
    repeating-linear-gradient(
      135deg,
      var(--bg-2) 0,
      var(--bg-2) 8px,
      #DDD3BE 8px,
      #DDD3BE 9px
    );
  position: relative;
  overflow: hidden;
}

image-slot::after {
  content: attr(placeholder);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
  padding: 16px;
  pointer-events: none;
  opacity: 0.7;
}
image-slot[data-filled="true"]::after { display: none; }

/* ---------- Scroll reveal ---------- */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease);
  transition-delay: var(--reveal-delay, 0ms);
  will-change: opacity, transform;
}
.reveal.is-in {
  opacity: 1;
  transform: translateY(0);
}

.reveal-up { transform: translateY(40px); }
.reveal-fade { transform: none; }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  height: 100vh;
  min-height: 720px;
  width: 100%;
  overflow: hidden;
  color: var(--paper);
  background: #1A1812;
}

.hero-media {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-media image-slot {
  --is-bg-color: #2a2620;
  background:
    repeating-linear-gradient(
      135deg,
      #2a2620 0,
      #2a2620 12px,
      #312c25 12px,
      #312c25 13px
    );
  width: 100%; height: 100%;
}
.hero-media image-slot::after { color: rgba(244,239,229,0.5); }
.hero-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.55) 100%);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 clamp(24px, 6vw, 96px) clamp(48px, 8vh, 96px);
}

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 32px;
  flex-wrap: wrap;
}

.hero-headline {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(54px, 8.5vw, 148px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--paper);
  margin: 0 0 24px;
  max-width: 16ch;
}
.hero-headline em {
  font-style: italic;
  color: #E8C5B5;
}

.hero-sub {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(18px, 1.6vw, 24px);
  line-height: 1.4;
  color: rgba(244, 239, 229, 0.82);
  max-width: 40ch;
}

/* ---------- Nav ---------- */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px clamp(24px, 6vw, 96px);
  color: var(--paper);
  mix-blend-mode: difference;
  transition: padding var(--med) var(--ease);
}

.nav-wordmark {
  display: inline-flex;
  align-items: center;
  height: 36px;
  text-decoration: none;
}
.nav-wordmark img {
  height: 100%;
  width: auto;
  display: block;
}

.nav-links {
  display: flex;
  gap: 36px;
  align-items: center;
}
.nav-links a {
  color: #fff;
  text-decoration: none;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  opacity: 0.85;
  transition: opacity 300ms;
}
.nav-links a:hover { opacity: 1; }

.nav-cta {
  border: 1px solid rgba(255,255,255,0.6);
  padding: 10px 18px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: #fff !important;
  text-decoration: none;
  transition: all var(--med) var(--ease);
}
.nav-cta:hover {
  background: #fff;
  color: #000 !important;
  border-color: #fff;
}

/* ---------- About ---------- */
.about-layout {
  display: grid;
  grid-template-columns: 5fr 6fr;
  gap: clamp(48px, 8vw, 140px);
  align-items: center;
}

.about-img {
  position: relative;
  aspect-ratio: 4 / 5;
  width: 100%;
}
.about-img-secondary {
  position: absolute;
  width: 42%;
  aspect-ratio: 3 / 4;
  right: -8%;
  bottom: -12%;
  z-index: 2;
  box-shadow: -20px 30px 60px rgba(0,0,0,0.18);
}

.about-text h2 {
  font-size: clamp(40px, 5vw, 76px);
  margin: 18px 0 28px;
  max-width: 14ch;
}

.signature {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--olive-deep);
  margin-top: 36px;
}
.signature small {
  display: block;
  font-family: var(--sans);
  font-style: normal;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 6px;
}

/* ---------- Cuisine (cinematic strips) ---------- */
.cuisine-intro {
  display: flex;
  align-items: baseline;
  gap: clamp(40px, 6vw, 96px);
  margin-bottom: clamp(48px, 8vh, 96px);
  max-width: 1100px;
}
.cuisine-intro .eyebrow {
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 14px;
}
.cuisine-intro h2 {
  font-size: clamp(28px, 2.8vw, 44px);
  max-width: 20ch;
  letter-spacing: -0.005em;
  line-height: 1.15;
  margin: 0;
}

.cuisine-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(40px, 5vw, 96px) clamp(40px, 6vw, 96px);
}

.dish {
  position: relative;
  overflow: hidden;
}

.dish-img {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  margin-bottom: 24px;
}
.dish-img image-slot {
  transition: transform 1400ms var(--ease);
}
.dish:hover .dish-img image-slot {
  transform: scale(1.04);
}

.dish-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
}
.dish-name {
  font-family: var(--serif);
  font-size: clamp(22px, 2vw, 30px);
  font-weight: 400;
  line-height: 1.15;
  margin: 0;
  letter-spacing: -0.01em;
}
.dish-name em { font-style: italic; color: var(--olive-deep); }

.dish-desc {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--ink-soft);
  margin-top: 6px;
  max-width: 32ch;
  line-height: 1.5;
}

.dish-num {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  color: var(--ink-soft);
}

/* offsets removed — uniform 2-column grid */
.dish.col-1, .dish.col-2, .dish.col-3, .dish.col-4 {
  grid-column: auto;
  margin-top: 0;
}

/* ---------- Menu ---------- */
.menu-section {
  background: var(--bg-2);
}

.menu-head {
  display: block;
  max-width: 760px;
  margin-bottom: 60px;
}
.menu-note {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(20px, 1.6vw, 26px);
  line-height: 1.5;
  color: var(--ink);
  margin: 0;
  letter-spacing: 0.005em;
  max-width: 60ch;
}
.menu-note em {
  font-style: italic;
  color: var(--olive-deep);
}

.menu-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-top: 1px solid var(--rule);
  margin-bottom: 40px;
}
.menu-tab {
  flex: 1 1 auto;
  text-align: left;
  padding: 22px 4px 18px;
  border: none;
  background: transparent;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
  position: relative;
  transition: color var(--med) var(--ease);
}
.menu-tab::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 0;
  height: 1px;
  width: 100%;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--med) var(--ease);
}
.menu-tab.active { color: var(--ink); }
.menu-tab.active::before { transform: scaleX(1); }
.menu-tab .tab-num {
  display: inline-block;
  margin-right: 10px;
  opacity: 0.55;
  font-size: 10px;
}

.menu-panel {
  display: grid;
  grid-template-columns: 3fr 5fr;
  gap: clamp(40px, 6vw, 96px);
  min-height: 480px;
}

.menu-aside {
  border-right: 1px solid var(--rule);
  padding-right: clamp(24px, 4vw, 48px);
}
.menu-aside h3 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(34px, 3.4vw, 52px);
  line-height: 1.05;
  margin: 12px 0 24px;
  letter-spacing: -0.01em;
}
.menu-aside h3 em { font-style: italic; color: var(--olive-deep); }
.menu-aside p {
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink-soft);
  margin: 0 0 18px;
}
.menu-price-tag {
  font-family: var(--serif);
  font-size: 22px;
  color: var(--terracotta);
  letter-spacing: 0.02em;
  margin-top: 28px;
}

.menu-items {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.menu-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  padding: 24px 0 22px;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}
.menu-item:first-child { border-top: 1px solid var(--rule); }
.menu-item-name {
  font-family: var(--serif);
  font-size: clamp(22px, 1.9vw, 28px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.005em;
}
.menu-item-name em { font-style: italic; color: var(--olive-deep); }
.menu-item-desc {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-top: 6px;
  max-width: 56ch;
}
.menu-item-price {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 300;
  color: var(--ink);
  white-space: nowrap;
}

/* ---------- Reservation ---------- */
.reserve-section {
  position: relative;
  padding: 0;
}
.reserve-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
}
.reserve-media {
  position: relative;
  min-height: 600px;
}
.reserve-media image-slot {
  background:
    repeating-linear-gradient(
      135deg,
      #2a2620 0,
      #2a2620 12px,
      #312c25 12px,
      #312c25 13px
    );
}
.reserve-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.55) 100%);
}
.reserve-media-caption {
  position: absolute;
  bottom: 48px;
  left: 48px;
  right: 48px;
  z-index: 2;
  color: #fff;
}
.reserve-media-caption h3 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(38px, 4vw, 64px);
  line-height: 1;
  margin: 16px 0 0;
  letter-spacing: -0.01em;
}
.reserve-media-caption h3 em { font-style: italic; }

.reserve-content {
  padding: clamp(60px, 10vh, 120px) clamp(40px, 6vw, 96px);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.reserve-content h2 {
  font-size: clamp(36px, 4.2vw, 64px);
  max-width: 12ch;
  margin: 16px 0 28px;
}

.reserve-hours {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  margin: 36px 0;
  border-top: 1px solid var(--rule);
}
.reserve-hour {
  padding: 18px 0;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 300;
  color: var(--ink);
  grid-column: span 2;
}
.reserve-hour .day {
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11px;
}
.reserve-hour.closed .time { color: var(--ink-soft); font-style: italic; font-family: var(--serif); }

.reserve-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  margin-top: 16px;
  border-top: 1px solid var(--rule);
}
.field {
  position: relative;
  border-bottom: 1px solid var(--rule);
  padding: 6px 0 0;
}
.field:nth-child(odd) { border-right: 1px solid var(--rule); padding-right: 20px; }
.field:nth-child(even) { padding-left: 20px; }
.field.full { grid-column: span 2; border-right: none; padding-right: 0; padding-left: 0; }
.field label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
  display: block;
  margin-top: 14px;
}
.field input, .field select {
  width: 100%;
  border: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 300;
  color: var(--ink);
  padding: 8px 0 18px;
  outline: none;
  appearance: none;
}
.field input::placeholder { color: rgba(26, 24, 18, 0.3); font-style: italic; }
.field-action {
  grid-column: span 2;
  padding-top: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.field-action .or {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  color: var(--ink-soft);
}
.field-action .phone-link {
  font-family: var(--serif);
  font-size: 22px;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: 0.01em;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 3px;
  transition: border-color 300ms;
}
.field-action .phone-link:hover { border-color: var(--ink); }

/* ---------- Atmosphere / Gallery ---------- */
.atmosphere {
  padding: clamp(100px, 16vh, 200px) clamp(24px, 6vw, 96px);
}

.atmo-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
  margin-bottom: clamp(60px, 10vh, 120px);
}
.atmo-head h2 {
  font-size: clamp(44px, 6vw, 96px);
  max-width: 11ch;
  color: var(--ink);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 80px;
  gap: clamp(12px, 1.5vw, 24px);
}

.gallery image-slot {
  background:
    repeating-linear-gradient(
      135deg,
      #2a2620 0,
      #2a2620 8px,
      #312c25 8px,
      #312c25 9px
    );
}
.gallery image-slot::after { color: rgba(244,239,229,0.45); }

.g1 { grid-column: 1 / span 4; grid-row: span 6; }
.g2 { grid-column: 5 / span 5; grid-row: span 4; }
.g3 { grid-column: 10 / span 3; grid-row: span 5; }
.g4 { grid-column: 5 / span 3; grid-row: span 4; }
.g5 { grid-column: 8 / span 2; grid-row: span 4; }
.g6 { grid-column: 10 / span 3; grid-row: span 3; }
.g7 { grid-column: 1 / span 4; grid-row: span 5; margin-top: clamp(40px, 6vh, 80px); }
.g8 { grid-column: 5 / span 4; grid-row: span 5; margin-top: clamp(20px, 3vh, 40px); }
.g9 { grid-column: 9 / span 4; grid-row: span 5; }

.atmo-pull {
  text-align: center;
  margin: clamp(80px, 12vh, 140px) auto 0;
  max-width: 26ch;
}
.atmo-pull blockquote {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(28px, 3vw, 44px);
  line-height: 1.25;
  margin: 0;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.atmo-pull cite {
  display: block;
  margin-top: 28px;
  font-style: normal;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ---------- Location ---------- */
.location-section { background: var(--paper); }

.location-layout {
  display: grid;
  grid-template-columns: 4fr 6fr;
  gap: clamp(40px, 6vw, 96px);
  align-items: stretch;
}

.location-text {
  display: flex;
  flex-direction: column;
}
.location-text h2 {
  font-size: clamp(36px, 4.2vw, 64px);
  max-width: 14ch;
  margin: 16px 0 28px;
}

.location-address {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 300;
  line-height: 1.55;
  color: var(--ink);
  margin: 8px 0 24px;
  padding: 22px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.location-address p { margin: 0; }

.location-map {
  position: relative;
  width: 100%;
  aspect-ratio: 5 / 4;
  overflow: hidden;
  background: var(--bg-2);
  box-shadow: 0 20px 50px rgba(0,0,0,0.10);
}
.location-map iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  filter: saturate(0.85) contrast(0.98);
}

/* ---------- Footer ---------- */
.footer {
  background: var(--paper);
  padding: clamp(80px, 12vh, 140px) clamp(24px, 6vw, 96px) 36px;
  position: relative;
}
.footer-wordmark {
  margin: 0 0 80px;
  max-width: 720px;
}
.footer-wordmark img {
  width: 100%;
  height: auto;
  display: block;
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 48px;
  padding-top: 60px;
  border-top: 1px solid var(--rule);
}
.footer-col h4 {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 18px;
}
.footer-col p, .footer-col a {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 300;
  line-height: 1.45;
  color: var(--ink);
  text-decoration: none;
  margin: 0 0 4px;
  display: block;
}
.footer-col a:hover { color: var(--terracotta); }

.footer-fine {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 80px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  color: var(--ink-soft);
}
.footer-fine a { color: var(--ink-soft); text-decoration: none; }
.footer-fine a:hover { color: var(--ink); }

/* ---------- Section opener (decorative meta) ---------- */
.section-meta {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  margin-bottom: clamp(40px, 6vh, 80px);
}
.section-meta .rule {
  height: 1px;
  background: var(--rule);
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .about-layout,
  .cuisine-intro,
  .menu-head,
  .reserve-layout,
  .menu-panel,
  .atmo-head,
  .location-layout,
  .footer-grid { grid-template-columns: 1fr; }
  .location-map { aspect-ratio: 4 / 3; }

  .reserve-form { grid-template-columns: 1fr; }
  .field:nth-child(odd) { border-right: none; padding-right: 0; }
  .field:nth-child(even) { padding-left: 0; }

  .dish.col-1, .dish.col-2, .dish.col-3, .dish.col-4 {
    grid-column: 1 / -1;
    margin-top: 0;
  }
  .nav-links { display: none; }
  .gallery {
    grid-auto-rows: 60px;
  }
  .g1,.g2,.g3,.g4,.g5,.g6,.g7,.g8,.g9 {
    grid-column: 1 / -1;
    grid-row: span 4;
    margin-top: 0;
  }
}

  <script>
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *

 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <script src="image-slot.js"><\/script>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */

  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.

          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {

      .then(() => { loaded = true; subs.forEach((fn) => fn()); });

  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;

    if (saving) { saveDirty = true; return; }

      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });

  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.

    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }

    // merged yet; the merge in load() keeps this change once the read lands.

      const h = Math.max(1, Math.round(bitmap.height * scale));

      canvas.width = w; canvas.height = h;

        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +

      });

      // baseline is computed from real dimensions, not the 100%×100% fallback.

        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;

          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;

          const sy = corner.includes('s') ? 1 : -1;

          const cy0 = (50 + this._view.y) / 100 * fh;

            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;

            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;

            this._applyView();
          };

          this.setAttribute('data-panning', '');

          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;

            this._applyView();
          };

          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };

        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });

      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).

        e.preventDefault();

        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;

    connectedCallback() {

      // cannot persist, and two id-less slots would share nothing.

      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.

      this._ro.observe(this);

    disconnectedCallback() {

      this.removeEventListener('dragover', this);

      if (this._ro) { this._ro.disconnect(); this._ro = null; }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();

      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {

      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;

    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {

        e.preventDefault();

        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>
  <script type="text/babel" data-presets="env,react">
/* Ruffino — Sektionen (deutsche Fassung mit italienischen Akzenten) */

const { useEffect, useRef, useState } = React;

/* ----- Scroll reveal hook ----- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            el.classList.add("is-in");
            io.unobserve(el);
          }
        });
      },
      { threshold: 0.18, rootMargin: "0px 0px -8% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ children, delay = 0, className = "", as: As = "div", style, ...rest }) {
  const ref = useReveal();
  return (
    <As
      ref={ref}
      className={`reveal ${className}`}
      style={{ ...(style || {}), "--reveal-delay": `${delay}ms` }}
      {...rest}
    >
      {children}
    </As>
  );
}

/* ----- Navigation ----- */
function Nav() {
  return (

function About() {
  return (
    <section className="section" id="about" data-screen-label="02 About">
      <div className="container">
        <Reveal className="section-meta">
          <span className="eyebrow">№ 02 — Das Haus</span>
          <span className="rule"></span>
          <span className="eyebrow" style={{ opacity: 0.6 }}>Seit 2014</span>
        </Reveal>

        <div className="about-layout">
          <Reveal>
            <div className="about-img">
              <image-slot id="about-1" src="https://d8j0ntlcm91z4.cloudfront.net/user_33IJIDZ0cOmwdzXkCP5nbQryjVC/hf_20260513_155812_6478df1f-5ed9-468e-b2e6-a86ecfce290d.png" placeholder="Chef beim Anrichten — natürliches Seitenlicht"></image-slot>
              <div className="about-img-secondary">
                <image-slot id="about-2" src="https://d8j0ntlcm91z4.cloudfront.net/user_33IJIDZ0cOmwdzXkCP5nbQryjVC/hf_20260513_155815_872a85fa-a0f6-4321-85da-8ec2cf0b70c0.png" placeholder="Detail — Hände, Pasta, Mehl"></image-slot>
              </div>
            </div>
          </Reveal>

          <Reveal delay={150} className="about-text">
            <span className="eyebrow with-rule">Ein stiller Tisch in Sendling</span>
            <h2 className="display">
              Wir kochen das<br/><em>Italien,</em><br/>an das wir uns<br/>erinnern.
            </h2>
            <div className="body-copy">
              <p>
                Ruffino begann mit einer einfachen Sehnsucht — nach einem unaufgeregten Tisch,
                einem sonnengebleichten Nachmittag in Ligurien, dem leisen Klirren einer Küche,
                die nichts beweisen muss. Zwölf Jahre später steht dieser Tisch in einer
                ruhigen Straße in Sendling-Westpark und wird jeden Abend mit derselben
                Achtsamkeit gedeckt.
              </p>
              <p>
                Wir arbeiten mit Erzeugern im Piemont und an der Adria, mit Käsemachern
                in den Alpenvorbergen und mit dem kleinen Markt an der Tegernseer
                Landstraße. Unsere Karte folgt den Jahreszeiten — die Pasta wird jeden
                Morgen frisch gerollt, der Fisch kommt im Ganzen, die Weinkarte ist mit
                der Hand geschrieben.
              </p>
              <p>
                Es gibt hier kein Schauspiel. Nur die ruhige Großzügigkeit eines
                italienischen Hauses, nach München verpflanzt und mit großer Sorgfalt
                gepflegt.
              </p>
            </div>

            <div className="signature">
              Marco Ruffino
              <small>Inhaber · Chef de Cuisine</small>
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

  <script type="text/babel" data-presets="env,react">
/* Ruffino — main app */
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "terracotta",
  "fontset": "modern",
  "showGrain": false,
  "heroHeadline": "Authentic Italian fine dining, quietly told.",
  "accent": "#7A3F3F"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply palette/font tweaks to root
  useEffect(() => {
    document.documentElement.dataset.palette = t.palette;
    document.documentElement.dataset.fontset = t.fontset;
    document.documentElement.style.setProperty("--terracotta", t.accent);
    document.body.style.setProperty("--grain", t.showGrain ? "0.06" : "0");
    const before = document.querySelector("style#grain-toggle");
    if (before) before.remove();
    const s = document.createElement("style");
    s.id = "grain-toggle";
    s.textContent = `body::before { opacity: ${t.showGrain ? 0.06 : 0} !important; }`;
    document.head.appendChild(s);
  }, [t.palette, t.fontset, t.showGrain, t.accent]);

  return (
    <>
      <Nav />
      <Hero />
      <About />
      <Cuisine />
      <Menu />
      <Reservation />
      <Atmosphere />
      <Location />
      <Footer />

      <TweaksPanel title="Tweaks · Ruffino">
        <TweakSection label="Palette">
          <TweakRadio
            label="Stimmung"
            value={t.palette}
            onChange={(v) => setTweak("palette", v)}
            options={[
              { value: "ivory", label: "Ivory" },
              { value: "olive", label: "Olive" },
              { value: "terracotta", label: "Terra" },
            ]}
          />
          <TweakColor
            label="Akzent"
            value={t.accent}
            onChange={(v) => setTweak("accent", v)}
            options={["#B8624A", "#8B6F3F", "#3E4633", "#A04A30", "#7A3F3F"]}
          />
        </TweakSection>

        <TweakSection label="Typografie">
          <TweakSelect
            label="Paarung"
            value={t.fontset}
            onChange={(v) => setTweak("fontset", v)}
            options={[
              { value: "display-serif", label: "Cormorant × Manrope" },
              { value: "modern", label: "Fraunces × Manrope" },
              { value: "classic", label: "EB Garamond × Archivo" },
            ]}
          />
        </TweakSection>

        <TweakSection label="Atmosphäre">
          <TweakToggle
            label="Filmkorn-Textur"
            value={t.showGrain}
            onChange={(v) => setTweak("showGrain", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
